<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar DAISY - カクテルカード</title>
    <link rel="stylesheet" href="style.css">
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
    <!-- heic2any (iPhoneのHEIC画像変換用ライブラリ) -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <div class="container">
        <!-- ページ上部のロゴ画像 -->
        <header class="top-header">
            <img src="rogo.PNG" alt="Bar DAISY" class="top-logo" onerror="this.style.display='none';">
            <p class="subtitle">オリジナルカクテルカード作成</p>
        </header>

        <!-- 入力フォームエリア -->
        <div class="form-card">
            <div class="input-group">
                <label for="numberInput">ナンバー（数字のみ）</label>
                <input type="number" id="numberInput" placeholder="例: 90">
            </div>

            <div class="input-group">
                <label for="cocktailNameInput">カクテル名</label>
                <input type="text" id="cocktailNameInput" placeholder="カクテル名を入力">
            </div>

            <div class="input-group">
                <label for="imageInput">カクテル写真</label>
                <input type="file" id="imageInput" accept="image/*,.heic,.HEIC">
            </div>
        </div>

        <!-- プレビュー・完成カードエリア -->
        <div class="preview-area">
            <h2>完成カード</h2>

            <div id="recipeCard" class="recipe-card">
                <div class="card-number" id="displayNumber">No.90</div>
                <div class="card-title" id="displayName">カクテル名</div>

                <!-- 写真表示エリア -->
                <div class="card-image-container">
                    <img id="displayImage" src="" alt="カクテル写真" style="display: none;">
                    <div id="imagePlaceholder" class="placeholder-text">写真未選択</div>
                </div>

                <div class="card-footer">
                    <img src="rogo.PNG" alt="Bar DAISY" class="footer-logo" onerror="this.style.display='none';">
                    <div class="footer-sub">ORIGINAL COCKTAIL RECIPE</div>
                </div>
            </div>

            <button type="button" id="downloadBtn" class="primary-btn">画像を保存する</button>
        </div>
    </div>
</body>
</html>
