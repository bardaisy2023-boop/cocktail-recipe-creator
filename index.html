<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar DAISY - カクテルカード</title>
    
    <!-- Google Fonts: M PLUS Rounded 1c & 筆記体フォント(Great Vibes) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
    <!-- heic2any -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <div class="container">
        <!-- ページ上部のロゴ画像 -->
        <header class="top-header">
            <img src="rogo.PNG" alt="Bar DAISY" class="top-logo" onerror="this.style.display='none';">
            <p class="subtitle">オリジナルカクテルカード作成</p>
        </header>

        <!-- 入力フォームエリア -->
        <div class="form-card">
            <div class="input-group">
                <label for="numberInput">No.</label>
                <input type="number" id="numberInput" placeholder="例: 1 ">
            </div>

            <div class="input-group">
                <label for="kanaInput">読み方</label>
                <input type="text" id="kanaInput" placeholder="例: よみかた">
            </div>

            <div class="input-group">
                <label for="cocktailNameInput">カクテル名</label>
                <input type="text" id="cocktailNameInput" placeholder="カクテル名を入力">
            </div>

            <div class="input-group">
                <label for="subtitleInput">サブタイトル</label>
                <input type="text" id="subtitleInput" placeholder="例: あればサブタイトル">
            </div>

            <div class="input-group">
                <label for="imageInput">カクテル写真</label>
                <input type="file" id="imageInput" accept="image/*,.heic,.HEIC">
            </div>
        </div>

        <!-- プレビュー・完成カードエリア -->
        <div class="preview-area">
            <h2>完成カード</h2>

            <div id="recipeCard" class="recipe-card">
                <!-- フレーム画像 -->
                <img src="frame.png" alt="Frame" class="card-frame-image" onerror="this.style.display='none';">

                <!-- 最上部の日付とナンバー -->
                <div class="card-top-info">
                    <span id="displayDate">Oct.11.2026</span>
                    <span id="displayNumber">No.000</span>
                </div>

                <!-- ヘッダータイトル部分 -->
                <div class="card-header-area">
                    <div class="card-sub-title">Your Own Original</div>
                    <div class="card-main-title">COCKTAIL</div>
                    
                    <!-- 読み方・カクテル名・サブタイトル -->
                    <div class="name-block">
                        <div class="card-kana" id="displayKana" style="display: none;"></div>
                        <div class="card-cocktail-name" id="displayName">ここにカクテル名</div>
                        <div class="card-subtext" id="displaySubtext" style="display: none;"></div>
                    </div>
                </div>

                <!-- 写真表示エリア -->
                <div class="card-image-container">
                    <img id="displayImage" src="" alt="カクテル写真" style="display: none;">
                    <div id="imagePlaceholder" class="placeholder-text">写真未選択</div>
                </div>

                <!-- フッターロゴ & 右下のデイジーイラスト -->
                <div class="card-footer">
                    <img src="rogo.PNG" alt="Bar DAISY" class="footer-logo" onerror="this.style.display='none';">
                    <img src="daisy-icon.png" alt="Daisy" class="daisy-bottom-icon" onerror="this.style.display='none';">
                </div>
            </div>

            <button type="button" id="downloadBtn" class="primary-btn">画像を保存する</button>
        </div>
    </div>
</body>
</html>
