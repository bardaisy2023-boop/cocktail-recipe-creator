<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar DAISY - カクテルレシピカード ジェネレーター</title>
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- html2canvas (画像化ライブラリ) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
    <!-- メインスクリプト -->
    <script src="app.js" defer></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Bar DAISY</h1>
            <p>オリジナルカクテル レシピカード作成</p>
        </header>

        <main>
            <!-- 入力フォームエリア -->
            <section class="form-section">
                <div class="form-group">
                    <label for="baseInput">ベース（例: Gin base）</label>
                    <input type="text" id="baseInput" placeholder="Gin base">
                </div>

                <div class="form-group">
                    <label for="cocktailNameInput">カクテル名</label>
                    <input type="text" id="cocktailNameInput" placeholder="カクテル名を入力">
                </div>

                <div class="form-group">
                    <label for="imageInput">カクテル写真</label>
                    <input type="file" id="imageInput" accept="image/*">
                </div>

                <div class="form-group">
                    <label>材料 (INGREDIENTS)</label>
                    <div id="ingredientsList">
                        <div class="ingredient-row">
                            <input type="text" class="ingredient-name" placeholder="材料名（例: ジン）">
                        </div>
                    </div>
                    <button type="button" id="addIngredientBtn" class="sub-btn">＋ 材料を追加</button>
                </div>

                <div class="form-group">
                    <label for="methodInput">METHOD</label>
                    <textarea id="methodInput" placeholder="作り方や技法を入力"></textarea>
                </div>

                <div class="form-group">
                    <label for="tasteNoteInput">TASTE NOTE</label>
                    <textarea id="tasteNoteInput" placeholder="味わいの特徴を入力"></textarea>
                </div>
            </section>

            <!-- プレビュー・完成カード表示エリア -->
            <section class="preview-section">
                <h2>完成カード</h2>
                
                <!-- レシピカード本体（写真が途切れず全体表示される設計） -->
                <div id="recipeCard" class="recipe-card">
                    <div class="card-inner">
                        <div id="cardBase" class="card-base">Gin base</div>
                        <div id="cardName" class="card-name">カクテル名</div>
                        
                        <div class="card-image-container">
                            <img id="cardImage" src="" alt="カクテル写真" style="display: none;">
                            <div id="imagePlaceholder" class="placeholder-text">写真が選択されていません</div>
                        </div>

                        <div class="card-divider">- INGREDIENTS -</div>
                        <div id="cardIngredients" class="card-ingredients">
                            <!-- 動的挿入 -->
                        </div>

                        <div class="card-section-title">METHOD:</div>
                        <div id="cardMethod" class="card-method">-</div>

                        <div class="card-section-title">TASTE NOTE:</div>
                        <div id="cardTaste" class="card-taste">-</div>

                        <div class="card-footer">
                            <div class="card-logo">DAISY</div>
                            <div class="card-subtext">ORIGINAL COCKTAIL RECIPE</div>
                        </div>
                    </div>
                </div>

                <button type="button" id="downloadBtn" class="primary-btn">画像を保存する</button>
            </section>
        </main>
    </div>
</body>
</html>
